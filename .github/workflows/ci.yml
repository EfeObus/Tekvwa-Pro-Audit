# =============================================
# Tekvwa Pro Audit - Continuous Integration
# Runs on every push and pull request
# =============================================

name: CI

on:
  push:
    branches: [main, develop, 'feature/**', 'release/**']
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: '3.11'
  POSTGRES_USER: tekvwa
  POSTGRES_PASSWORD: tekvwa_test
  POSTGRES_DB: tekvwa_pro_audit_test

jobs:
  # =============================================
  # LINT & FORMAT CHECK
  # =============================================
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install black isort flake8 mypy
      
      - name: Check code formatting with Black
        run: black --check --diff .
        continue-on-error: true
      
      - name: Check import sorting with isort
        run: isort --check-only --diff .
        continue-on-error: true
      
      - name: Lint with flake8
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

  # =============================================
  # SECURITY SCANNING
  # =============================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety pip-audit
      
      - name: Run Bandit security linter
        run: bandit -r app/ -ll -ii -x tests/ || true
      
      - name: Check dependencies for vulnerabilities
        run: |
          pip install -r requirements.txt
          pip-audit || true
      
      - name: Check for secrets in code
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified
        continue-on-error: true

  # =============================================
  # UNIT TESTS
  # =============================================
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    needs: lint
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run database migrations
        env:
          DATABASE_URL: postgresql://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@localhost:5432/${{ env.POSTGRES_DB }}
          DATABASE_URL_ASYNC: postgresql+asyncpg://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@localhost:5432/${{ env.POSTGRES_DB }}
          SECRET_KEY: test-secret-key-for-ci
          JWT_SECRET_KEY: test-jwt-secret-key-for-ci-testing-only
          REDIS_URL: redis://localhost:6379/0
          SUPER_ADMIN_EMAIL: info@tekvwa.org
          SUPER_ADMIN_PASSWORD: TestPassword123!
        run: |
          # Use direct table creation to avoid alembic enum conflicts
          python scripts/create_railway_tables.py || alembic upgrade head || echo "Migration skipped - tables may already exist"
      
      - name: Run tests with coverage
        env:
          DATABASE_URL: postgresql://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@localhost:5432/${{ env.POSTGRES_DB }}
          DATABASE_URL_ASYNC: postgresql+asyncpg://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@localhost:5432/${{ env.POSTGRES_DB }}
          SECRET_KEY: test-secret-key-for-ci
          JWT_SECRET_KEY: test-jwt-secret-key-for-ci-testing-only
          REDIS_URL: redis://localhost:6379/0
          TESTING: "true"
          SUPER_ADMIN_EMAIL: info@tekvwa.org
          SUPER_ADMIN_PASSWORD: TestPassword123!
          SUPER_ADMIN_FIRST_NAME: Test
          SUPER_ADMIN_LAST_NAME: Admin
        run: |
          pytest tests/ \
            --cov=app \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term-missing \
            --junit-xml=test-results.xml \
            -v \
            --tb=short \
            || true
          # NOTE (Phase 0 of docs/IMPLEMENTATION_ROADMAP.md): `-x` was removed so the full suite
          # always runs and the summary step below reports real counts, not just "stopped at test 1".
          # `|| true` is intentionally still here — CI cannot yet gate on test results (Finding 15.6).
          # Removing it is Phase 9, Section 9.6, gated on Findings 27-31 being fixed first. Do not
          # remove it ahead of that section.

      - name: Report test summary (non-blocking — visibility only, does not gate the build)
        if: always()
        run: |
          python -c "
          import xml.etree.ElementTree as ET
          import sys
          try:
              tree = ET.parse('test-results.xml')
          except FileNotFoundError:
              print('::warning::No test-results.xml found — pytest may not have run to completion.')
              sys.exit(0)
          root = tree.getroot()
          suite = root if root.tag == 'testsuite' else root.find('testsuite')
          tests = suite.get('tests', '0')
          failures = suite.get('failures', '0')
          errors = suite.get('errors', '0')
          skipped = suite.get('skipped', '0')
          summary = f'### Test Results (visibility only — does not gate this build; see Finding 15.6 in docs/PRODUCTION_AUDIT_2026.md)\n\n'
          summary += f'| Total | Passed | Failed | Errored | Skipped |\n|---|---|---|---|---|\n'
          passed = int(tests) - int(failures) - int(errors) - int(skipped)
          summary += f'| {tests} | {passed} | {failures} | {errors} | {skipped} |\n'
          if int(failures) > 0 or int(errors) > 0:
              summary += f'\n**{int(failures)+int(errors)} test(s) currently failing/erroring.** This does not fail the build yet (Finding 15.6) but should not be ignored.\n'
          import os
          summary_path = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary_path:
              with open(summary_path, 'a') as f:
                  f.write(summary)
          print(summary)
          "

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          verbose: true
        continue-on-error: true
      
      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 7

  # =============================================
  # BUILD DOCKER IMAGE
  # =============================================
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [test, security]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: production
          push: false
          tags: tekvwa-pro-audit:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Test Docker image
        run: |
          docker build -t tekvwa-pro-audit:test --target production .
          docker run --rm tekvwa-pro-audit:test python -c "import app; print('Import successful')"
